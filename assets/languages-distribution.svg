<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 215" width="520" height="215" fill="none">
  <style>
    .card {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 12px;
    }
    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #58a6ff;
    }
    .header-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #8b949e;
    }
    .lang-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .lang-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: #8b949e;
    }
    .footer-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #7ee787;
    }
    .footer-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      fill: #8b949e;
    }
  </style>

  <!-- Background Card -->
  <rect width="520" height="215" class="card" />

  <!-- Card Header -->
  <g transform="translate(30, 30)">
    <!-- Terminal / Code Icon -->
    <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM4.22 5.47a.75.75 0 0 1 1.06 0l2.25 2.25a.75.75 0 0 1 0 1.06L5.28 11.03a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L5.94 8.25 4.22 6.53a.75.75 0 0 1 0-1.06Zm4.53 4.28h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5Z" fill="#58a6ff" />
    <text x="24" y="12" class="header-title">Active Codebase Distribution</text>
    <text x="460" y="12" text-anchor="end" class="header-badge">507,706 Lines of Code Audited</text>
  </g>

  <!-- Segmented Progress Bar -->
  <g transform="translate(30, 56)">
    <clipPath id="bar-clip">
      <rect width="460" height="10" rx="5" />
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <!-- TypeScript (26.9%) -> 123.9px -->
      <rect x="0" y="0" width="123.9" height="10" fill="#3178c6" />
      <!-- SQL (22.6%) -> 104.0px -->
      <rect x="123.9" y="0" width="104.0" height="10" fill="#e38c00" />
      <!-- PHP (21.7%) -> 99.8px -->
      <rect x="227.9" y="0" width="99.8" height="10" fill="#4f5d95" />
      <!-- JavaScript (18.4%) -> 84.6px -->
      <rect x="327.7" y="0" width="84.6" height="10" fill="#f1e05a" />
      <!-- Python (10.4%) -> 47.7px -->
      <rect x="412.3" y="0" width="47.7" height="10" fill="#3572a5" />
    </g>
  </g>

  <!-- Languages Legend Grid -->
  <!-- Column 1 -->
  <g transform="translate(30, 96)">
    <!-- TypeScript -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="5" fill="#3178c6" />
      <text x="18" y="9" class="lang-name">TypeScript</text>
      <text x="100" y="9" class="lang-meta">26.9%</text>
      <text x="145" y="9" class="lang-meta">·  136.8k lines</text>
    </g>

    <!-- PHP -->
    <g transform="translate(0, 32)">
      <circle cx="5" cy="5" r="5" fill="#4f5d95" />
      <text x="18" y="9" class="lang-name">PHP</text>
      <text x="100" y="9" class="lang-meta">21.7%</text>
      <text x="145" y="9" class="lang-meta">·  110.0k lines</text>
    </g>

    <!-- Python -->
    <g transform="translate(0, 64)">
      <circle cx="5" cy="5" r="5" fill="#3572a5" />
      <text x="18" y="9" class="lang-name">Python</text>
      <text x="100" y="9" class="lang-meta">10.4%</text>
      <text x="145" y="9" class="lang-meta">·  52.7k lines</text>
    </g>
  </g>

  <!-- Column 2 -->
  <g transform="translate(270, 96)">
    <!-- SQL -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="5" fill="#e38c00" />
      <text x="18" y="9" class="lang-name">SQL</text>
      <text x="92" y="9" class="lang-meta">22.6%</text>
      <text x="137" y="9" class="lang-meta">·  114.8k lines</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(0, 32)">
      <circle cx="5" cy="5" r="5" fill="#f1e05a" />
      <text x="18" y="9" class="lang-name">JavaScript</text>
      <text x="92" y="9" class="lang-meta">18.4%</text>
      <text x="137" y="9" class="lang-meta">·  93.4k lines</text>
    </g>

    <!-- Foundations / Architecture Note -->
    <g transform="translate(0, 64)">
      <!-- Check / Diamond Icon -->
      <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm11.78-1.72a.75.75 0 0 0-1.06-1.06L6.75 9.19 5.28 7.72a.75.75 0 0 0-1.06 1.06l2 2a.75.75 0 0 0 1.06 0l4.5-4.5Z" fill="#7ee787" transform="translate(0, -3) scale(0.9)" />
      <text x="18" y="9" class="footer-badge">Stack Moderno</text>
      <text x="110" y="9" class="footer-desc">· Cloud, APIs &amp; Data</text>
    </g>
  </g>
</svg>
