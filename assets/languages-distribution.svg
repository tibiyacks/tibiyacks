    <text x="18" y="9" class="lang-name">SQL</text>
    <text x="210" y="9" text-anchor="end" class="lang-pct">22.6%</text>
  </g>

  <!-- PHP -->
  <g transform="translate(180, 115)">
    <circle cx="5" cy="5" r="5" fill="#4f5d95" />
    <text x="18" y="9" class="lang-name">PHP</text>
    <text x="210" y="9" text-anchor="end" class="lang-pct">21.7%</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(180, 140)">
    <circle cx="5" cy="5" r="5" fill="#f1e05a" />
    <text x="18" y="9" class="lang-name">JavaScript</text>
    <text x="210" y="9" text-anchor="end" class="lang-pct">18.4%</text>
  </g>

  <!-- Python -->
  <g transform="translate(180, 165)">
    <circle cx="5" cy="5" r="5" fill="#3572a5" />
    <text x="18" y="9" class="lang-name">Python</text>
