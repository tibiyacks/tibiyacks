<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 195" width="420" height="195" fill="none">
  <style>
    .card {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 12px;
    }
    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #58a6ff;
    }
    .lang-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #c9d1d9;
    }
    .lang-pct {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #8b949e;
    }
    .center-icon {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
