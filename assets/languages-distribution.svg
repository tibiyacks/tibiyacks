    }
  </style>

  <!-- Background Card -->
  <rect width="420" height="195" class="card" />

  <!-- Card Header -->
  <g transform="translate(24, 28)">
    <path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM4.22 5.47a.75.75 0 0 1 1.06 0l2.25 2.25a.75.75 0 0 1 0 1.06L5.28 11.03a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L5.94 8.25 4.22 6.53a.75.75 0 0 1 0-1.06Zm4.53 4.28h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5Z" fill="#58a6ff" />
    <text x="24" y="12" class="header-title">Active Technologies Breakdown</text>
  </g>

  <!-- Donut Chart -->
  <!-- Base circle / background track -->
  <circle cx="85" cy="115" r="52" stroke="#21262d" stroke-width="14" fill="none" />

  <!-- Segments: r=52, C=326.73 -->
  <!-- TypeScript (26.9%) -->
  <circle cx="85" cy="115" r="52" stroke="#3178c6" stroke-width="14" fill="none"
          stroke-dasharray="88.02 326.73" transform="rotate(-90.00 85 115)" />

  <!-- SQL (22.6%) -->
  <circle cx="85" cy="115" r="52" stroke="#e38c00" stroke-width="14" fill="none"
          stroke-dasharray="73.90 326.73" transform="rotate(6.98 85 115)" />

  <!-- PHP (21.7%) -->
  <circle cx="85" cy="115" r="52" stroke="#4f5d95" stroke-width="14" fill="none"
          stroke-dasharray="70.78 326.73" transform="rotate(88.41 85 115)" />

  <!-- JavaScript (18.4%) -->
  <circle cx="85" cy="115" r="52" stroke="#f1e05a" stroke-width="14" fill="none"
          stroke-dasharray="60.10 326.73" transform="rotate(166.39 85 115)" />

  <!-- Python (10.4%) -->
  <circle cx="85" cy="115" r="52" stroke="#3572a5" stroke-width="14" fill="none"
